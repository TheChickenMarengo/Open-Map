<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open Map</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0e1013">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Open Map">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: one-screen phone app on drafting paper. Header strip, scrolling view, bottom tabs.
   Palette is Jerry's own pencils: Copenhagen blue and apple green, plus the red of his cards. Single dark theme by choice. */
:root{
  --paper:#0e1013; --sheet:#171a1f; --ink:#e6e8e2; --ink2:#8f98a3; --line:#2a2f36;
  --blue:#5b9bea; --green:#7fc24a; --red:#e5594b; --blank:#22262c;
  --display:'Barlow Condensed','Arial Narrow',sans-serif;
  --body:'IBM Plex Sans',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;background:var(--paper)}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:12px 16px 10px;border-bottom:2px solid var(--ink)}
h1{font-family:var(--display);font-weight:700;font-size:30px;line-height:1;margin:0;letter-spacing:.01em;text-transform:uppercase}
.sub{display:block;font-family:var(--mono);font-size:11px;color:var(--ink2);margin-top:4px}
.stats{white-space:nowrap;font-family:var(--mono);font-size:11px;text-align:left;color:var(--ink2);line-height:1.5}
.stats b{color:var(--ink);font-weight:500}
main{flex:1;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch}
nav{display:grid;grid-template-columns:repeat(4,1fr);border-top:2px solid var(--ink);background:var(--sheet)}
nav button{font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;padding:14px 4px;border:0;background:transparent;color:var(--ink2);cursor:pointer;border-right:1px solid var(--line)}
nav button:last-child{border-right:0}
nav button[aria-current="true"]{background:var(--ink);color:var(--sheet)}
button,.btn{font:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.primary,.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border:2px solid var(--ink);border-radius:4px;background:var(--sheet);color:var(--ink);font-family:var(--mono);font-size:13px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;text-align:center}
.primary{background:var(--ink);color:var(--sheet)}
.primary:active,.btn:active{transform:translateY(1px)}
.stage{display:flex;flex-direction:column;align-items:center;gap:16px}
.stage>.primary{width:100%;max-width:300px}
.row{display:flex;gap:10px;width:100%;max-width:300px;flex-wrap:wrap}
.row>*{flex:1 1 120px}
.hint,.last,.note{font-family:var(--mono);font-size:12px;color:var(--ink2);margin:0;text-align:center;max-width:300px}
.last{color:var(--ink);border-left:3px solid var(--blue);text-align:left;padding:2px 0 2px 10px;font-size:13px;background:none}
/* cards */
.card{--cink:#16202b;--cred:#c63a2d;position:relative;width:260px;min-height:364px;background:#f5f2e9;color:var(--cink);border:1px solid rgba(0,0,0,.45);border-radius:14px;box-shadow:0 12px 26px rgba(0,0,0,.55),inset 0 0 0 5px #f5f2e9,inset 0 0 0 6px rgba(22,32,43,.18);padding:58px 30px 48px;overflow:hidden;display:flex;flex-direction:column;align-items:center;text-align:center}
.card.red{color:var(--cred)}
.ck{list-style:none;margin:2px 0 8px;padding:0;font-size:14px}
.ck li{padding:2px 0;color:var(--text-secondary)}
.ck li.ok{color:var(--text-success)}
.card .idx{position:absolute;left:12px;top:8px;display:flex;flex-direction:column;align-items:center;line-height:1;font-family:var(--display);font-weight:700}
.card .idx b{font-size:24px;font-weight:700;letter-spacing:-.01em}
.card .idx i{font-style:normal;font-size:18px;margin-top:2px}
.card .idx.br{left:auto;top:auto;right:12px;bottom:8px;transform:rotate(180deg)}
.card .art{width:100%;aspect-ratio:4/3;border:1.5px solid currentColor;border-radius:8px;padding:5px;display:grid;grid-template-columns:repeat(8,1fr);gap:2px;background:#fffdf6}
.card .art i{display:block;border-radius:1px}
.cname{font-family:var(--display);font-weight:700;font-size:28px;text-transform:uppercase;line-height:1.05;margin-top:10px}
.dir{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;opacity:.7;margin-top:3px}
.rule{margin:8px 0 0;font-size:12.5px;line-height:1.4;color:#2c3640}
.card.red .rule{color:#5a2a25}
/* deck: a stack of backs; tapping it draws */
.deckbtn{position:relative;width:132px;height:184px;padding:0;border:0;background:transparent;cursor:pointer;margin:6px 0 14px}
.deckbtn .cb{position:absolute;inset:0;border-radius:11px;border:1px solid rgba(0,0,0,.5);background:#1b3a63;box-shadow:0 3px 8px rgba(0,0,0,.5)}
.deckbtn .cb:nth-child(1){transform:translate(-6px,6px)}.deckbtn .cb:nth-child(2){transform:translate(-4px,4px)}.deckbtn .cb:nth-child(3){transform:translate(-2px,2px)}
.deckbtn .cb:nth-child(4){background:#f5f2e9;padding:6px}
.deckbtn .cb:nth-child(4)::before{content:'';position:absolute;inset:6px;border-radius:7px;background:repeating-linear-gradient(45deg,#1f5fa8 0 6px,#16202b 6px 12px);box-shadow:inset 0 0 0 2px #f5f2e9,inset 0 0 0 3px #16202b}
.deckbtn:active .cb:nth-child(4){transform:translateY(2px)}
.deckbtn:hover .cb:nth-child(4){transform:translateY(-3px)}
.deckbtn .cb:nth-child(4){transition:transform .12s}
/* dice */
.dice{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.die{width:56px;border:2px solid var(--ink);border-radius:6px;background:var(--sheet);text-align:center;padding:4px 0 3px}
.die b{display:block;font-family:var(--display);font-size:32px;line-height:1.05}
.die small{font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.tumble .die{animation:tumble .7s ease-out both}
.tumble .die:nth-child(2){animation-delay:.08s}.tumble .die:nth-child(3){animation-delay:.16s}.tumble .die:nth-child(4){animation-delay:.24s}
@keyframes tumble{0%{transform:rotate(-200deg) scale(.4);opacity:0}70%{transform:rotate(12deg) scale(1.06);opacity:1}100%{transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.where{font-family:var(--mono);font-size:12px;text-align:center;margin:0;max-width:300px}
.where b{font-weight:500;color:var(--blue)}
.prevwrap{border:2px solid var(--ink);background:var(--sheet);padding:6px;line-height:0}
.prevwrap canvas{width:200px;height:auto;display:block}
.prevwrap canvas.w{width:min(340px,80vw)}
.prevwrap canvas.t{width:130px}
.edbox{position:relative;overflow:hidden;touch-action:none;cursor:grab;line-height:0}
.edbox .crop{position:absolute;border:2px solid #fff;box-shadow:0 0 0 1px #000,0 0 0 999px rgba(0,0,0,.5);pointer-events:none}
.reframe{width:100%;display:flex;flex-direction:column;gap:6px;align-items:center;margin-top:10px;font-size:12px;color:var(--ink2)}
.reframe input{width:min(260px,80%)}
.fl{position:absolute;box-sizing:border-box;border:2px solid #ffd23f;box-shadow:0 0 10px #ffd23f,inset 0 0 6px #ffd23f;pointer-events:none;z-index:3;animation:flashO 4.2s ease-out forwards}
.fl.all{inset:0;width:auto;height:auto;border-width:3px}
@keyframes flashO{0%,12%,28%,44%{opacity:1}20%,36%{opacity:.25}70%{opacity:1}100%{opacity:0}}
.pair{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.pair.two .prevwrap canvas{width:140px}
.pair.big{flex-direction:column;align-items:center}.pair.big.two .prevwrap canvas,.pair.big .prevwrap canvas{width:min(330px,82vw)}
.camrow{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;max-width:300px}
.bigcam{width:100%;min-height:68px;font-size:16px}
.refbtns{display:flex;gap:8px;justify-content:center}.refbtns .btn{min-height:36px;padding:4px 12px;font-size:12px}
.maptb{border-top:2px solid var(--ink);background:var(--sheet);flex:none;padding:6px 8px}
.maptb .tbrow{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.maptb .btn{min-height:36px;padding:3px 4px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.maptb .btn[aria-pressed=true]{background:var(--ink);color:var(--sheet)}
.maptb .tbrow+.tbrow{margin-top:6px}
.maptb.min{padding:4px 8px}
.maptb.min .tbrow{display:none}
.maptb .tbh{width:100%;min-height:26px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:0;margin:0}
.maptb:not(.min) .tbh{margin-top:6px}
.chron .day{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);margin:18px 0 6px;border-bottom:1px solid var(--line);padding-bottom:4px}
.chron .ch{display:grid;grid-template-columns:48px 1fr;gap:12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 0;color:var(--ink);cursor:pointer;font:inherit}
.chron .ch img,.chron .ch .ph{width:48px;aspect-ratio:4/5;object-fit:cover;border:1px solid var(--ink);background:var(--blank)}
.chron .ch .s{font-size:14px;line-height:1.4}.chron .ch .n .red{color:var(--red)}
.chron .ch .n{font-family:var(--mono);font-size:10px;color:var(--ink2);margin-top:3px}
.mrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}.mrow b{flex:1 1 100%}
.chron div.ch{cursor:default}.chron .ch .ic{display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--ink2)}.chron .ch .ic.red{color:var(--red)}
.fils{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 0}.fil{padding:4px 10px;font-size:12px}
.term{border-bottom:1px dotted currentColor;cursor:help}
.gpop{position:fixed;left:12px;right:12px;bottom:84px;max-width:380px;margin:0 auto;background:var(--sheet);border:2px solid var(--ink);padding:12px 14px;z-index:30;box-shadow:0 4px 0 var(--ink)}
.gpop h3{margin:0 0 4px;font-family:var(--display);text-transform:uppercase;font-size:20px;font-weight:400}.gpop p{margin:0 0 8px;font-size:14px}
.gpop .btn{min-height:36px;padding:4px 14px}
.open{max-width:320px;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
.open h2{margin:0}
.open p{margin:0;font-size:15px}
.open ol{margin:0;padding-left:20px;text-align:left;font-size:14px}
.pbar{width:100%;height:14px;border:2px solid var(--ink);background:var(--sheet)}
.pbar i{display:block;height:100%;background:var(--blue);transition:width .3s}
.plus{display:grid;grid-template-columns:repeat(3,26px);gap:3px}
.plus i{width:26px;height:32px;background:var(--line)}
.plus i.on{background:var(--ink)}
.prompt.edit{border-top-color:var(--blue)}
.prompt{max-width:300px;margin:0;font-size:18px;font-weight:500;text-align:left;border-top:2px solid var(--green);padding-top:8px;width:100%}
.prompt span{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);margin-bottom:2px}
textarea{width:100%;max-width:300px;min-height:110px;padding:10px;border:2px solid var(--ink);border-radius:4px;background:var(--sheet);font:inherit;color:var(--ink);resize:vertical}
/* map */
.full{padding:0;overflow:hidden;display:flex;flex-direction:column;position:relative}
.full .mapbox{display:flex;flex:1;max-height:none;min-height:0;padding:8px}
.histbar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--sheet);border-bottom:2px solid var(--ink);flex-wrap:wrap}
.histbar .btn{min-height:36px;padding:4px 12px}
.statgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.statgrid div{background:var(--sheet);border:1px solid var(--line);padding:8px 10px;min-width:0;text-align:left}
.statgrid b{display:block;font-family:var(--display);font-size:28px;line-height:1.05}.statgrid span{font-size:12px;color:var(--ink2)}
.bar{display:flex;align-items:center;gap:8px;font-size:13px;margin:4px 0}.bar .bl{flex:0 0 132px}.bar .bw{flex:1;display:flex;background:var(--sheet);height:12px}.bar .bw i{display:block;height:100%}.bar .bv{flex:0 0 40px;text-align:right;font-family:var(--mono);font-size:12px;color:var(--ink2)}
#statsBody{white-space:normal}
.ss{border-top:1px solid var(--line);margin-top:12px}.ss>summary{font-family:var(--display);font-size:22px;padding:12px 0;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:44px}.ss>summary::-webkit-details-marker{display:none}.ss>summary::after{content:'+';font-family:var(--mono);color:var(--ink2)}.ss[open]>summary::after{content:'\2212'}
.rc{background:var(--sheet);border:1px solid var(--line);padding:10px 12px;margin:6px 0}.rc>b{display:block;font-size:15px;font-weight:600;color:var(--ink)}.rc .rm{font-size:13px;color:var(--ink2);margin-top:3px;line-height:1.4}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 16px;font-size:14px;margin:6px 0}.kv span:nth-child(even){text-align:right;font-family:var(--mono);color:var(--ink)}
.tag{display:inline-block;padding:3px 9px;border:1px solid var(--line);font-size:12px;margin:6px 6px 0 0;color:var(--ink2)}.tag.war{color:#ff8a7a;border-color:#a33}.tag.ally{color:#8fd18f;border-color:#3a6b3a}
@media(max-width:520px){.stats .bar{flex-wrap:wrap;row-gap:3px}.stats .bar .bl{flex:1 1 0;min-width:0}.stats .bar .bv{flex:0 0 auto}.stats .bar .bw{flex:1 0 100%;order:3;height:10px}.statgrid b{font-size:24px}}
svg.chart{width:100%;height:auto;background:var(--sheet);border:1px solid var(--line);display:block}
.stepinfo{flex:1 1 100%;font-size:12px;color:var(--ink2);line-height:1.35}
.histbar input[type=range]{flex:1 1 120px;min-width:100px;accent-color:var(--blue)}
.opts h2{margin:18px 0 10px}.opts h2:first-child{margin-top:4px}
.plist{margin:0;padding-left:22px}.plist li{margin:4px 0;font-size:14px}
.keyv h2{margin:20px 0 8px}
.kr{display:flex;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.ksw{width:96px;height:48px;flex:none;border:1px solid var(--line);border-radius:3px;background:var(--sheet)}
.kr b{display:block;font-size:14px}.kr span{display:block;font-size:12.5px;color:var(--ink2);line-height:1.35;margin-top:2px}
.optlist{display:flex;flex-direction:column;gap:10px}
.optlist .btn{justify-content:flex-start;width:100%}
.optlist .btn[aria-pressed=true]{background:var(--ink);color:var(--sheet)}
.backbtn{margin-bottom:12px;min-height:40px}
.drawzone.first{margin-top:0;padding-top:0;border-top:0}
.step{font-family:var(--mono);font-size:11px;color:var(--ink2)}
.mapbox{overflow:auto;border:0;background:transparent;padding:0;max-height:68vh}
.dealwrap{perspective:900px}
.deal .card{animation:flipIn .75s cubic-bezier(.2,.8,.25,1) both}
.deal .card::after{content:'';position:absolute;inset:0;border-radius:14px;box-shadow:inset 0 0 0 7px #f5f2e9;background:repeating-linear-gradient(45deg,#1f5fa8 0 7px,#16202b 7px 14px);animation:backFade .75s steps(1) both;pointer-events:none}
@keyframes flipIn{0%{transform:translateY(-150px) translateX(0) rotateY(180deg) scale(.4);opacity:0}30%{opacity:1}100%{transform:none;opacity:1}}
@keyframes backFade{0%,50%{opacity:1}51%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.deal .card,.deal .card::after{animation:none}}
.rules h2:first-child{margin-top:4px}
.rules ul{margin:0 0 6px;padding-left:18px;font-size:14px;line-height:1.5}
.rules li{margin-bottom:3px}
.rules p{font-size:14px;margin:0 0 8px}
.rules b{font-weight:600}
.drawzone{margin-top:18px;padding-top:16px;border-top:2px solid var(--ink)}
.mapgrid{display:grid;gap:0;width:max-content;margin:0 auto;position:relative}
.full .mapgrid{margin:auto;flex:none}
.mapbox{touch-action:pan-x pan-y}
.cnums{position:absolute;inset:0;pointer-events:none;z-index:2;-webkit-text-size-adjust:none;text-size-adjust:none}
.cn{position:absolute;font:400 8px/1 system-ui,-apple-system,Helvetica,Arial,sans-serif!important;font-size:8px!important;-webkit-text-size-adjust:none;text-size-adjust:none;min-width:0;color:rgba(244,164,132,.8);white-space:nowrap}
.contours{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.labwrap{position:absolute;inset:0;pointer-events:none;z-index:4}
.labels{position:absolute;inset:0;pointer-events:none}
.labels .lb:not(.sea){opacity:var(--lo,.9)}
.labels .lb.sea{opacity:1;color:#a9d3f5}
.cext{position:absolute;inset:0;pointer-events:none}
.cdot{position:absolute;width:9px;height:9px;padding:0;border:1.5px solid #0e1013;border-radius:50%;background:#f1ece0;transform:translate(-50%,-50%);pointer-events:auto;cursor:pointer;box-shadow:0 0 0 1px rgba(241,236,224,.7)}
.cdot::after{content:"";position:absolute;inset:-9px}
.cdot.village{width:7px;height:7px;border-width:1.5px;border-radius:1px}
.cdot.hamlet{width:7px;height:7px;border:1.5px solid #f1ece0;background:#0e1013;box-shadow:0 0 0 1.5px #0e1013}
.cdot.hamlet.on{background:#e7c34a;border-color:#0e1013}
.cdot.on{background:#e7c34a;box-shadow:0 0 0 2px #e7c34a}
.cdot.short{box-shadow:0 0 0 2px #c0392b}
.cdot.short.on{box-shadow:0 0 0 2px #e7c34a,0 0 0 4px #c0392b}
.mid .cdot.village,.mid .cdot.hamlet{display:none}
.ccard:not(.insp){white-space:normal;width:max-content;max-width:210px;line-height:1.4}
.ccard.insp{white-space:normal;width:max-content;max-width:190px;line-height:1.4}
.cx{position:absolute;background:rgba(231,195,74,.3);outline:1.5px solid #e7c34a;outline-offset:-1px;pointer-events:none}
.ccard{position:absolute;transform:translate(-50%,14px);background:#0e1013;border:1.5px solid #e7c34a;color:#f1ece0;padding:4px 7px;font:400 10px/1.35 system-ui,sans-serif;white-space:nowrap;pointer-events:none;z-index:2}
.lb{position:absolute;white-space:nowrap;font:400 8px/1 system-ui,-apple-system,Helvetica,Arial,sans-serif!important;font-size:8px!important;-webkit-text-size-adjust:none;text-size-adjust:none;color:rgba(241,236,224,.85);text-shadow:0 0 2px rgba(0,0,0,.55),0 0 2px rgba(0,0,0,.55);letter-spacing:.03em}
.lb.city{font-size:9px!important;font-weight:500;letter-spacing:.08em;text-transform:uppercase}
.lb.odd{font-style:italic;color:#c9b6ff;opacity:.85}
.lb.water{font-style:italic;color:#a9d3f5}
.lb.sea{font-style:italic!important;text-transform:none;letter-spacing:.04em;color:#8fc0e6;font-size:7.5px!important;font-weight:400!important}
.lb.ridge{text-transform:uppercase;letter-spacing:.14em;font-size:7px!important}
.lb.ruin{font-style:italic!important;color:#d6cfba;font-size:7px!important}
.lb.realm{font-style:italic!important;text-transform:uppercase;letter-spacing:.16em;font-size:9px!important;font-weight:600;color:#f7e4b4;opacity:1!important;-webkit-text-stroke:4px rgba(8,10,14,.95)}
.near .lb.realm{font-size:10px!important}.mid .lb.realm{font-size:11.5px!important}.far .lb.realm{font-size:13.5px!important}
.lb.region{font-style:italic!important;text-transform:uppercase;letter-spacing:.22em;font-size:8px!important;color:#ece2c0;opacity:.8!important;-webkit-text-stroke:1.6px rgba(8,10,14,.6)}
.mapgrid:not(.near) .lb.region{display:none}
.far .lb.village,.far .lb.hamlet,.far .lb.odd,.far .lb.ridge{display:none}.mid .lb.odd,.mid .lb.ridge,.mid .lb.village{display:none}.near .lb.hamlet{display:none}.lb.hamlet{font-size:7px!important}
.lb{paint-order:stroke fill;-webkit-text-stroke:3px rgba(8,10,14,.9);text-shadow:0 0 3px rgba(0,0,0,.9)!important}
.lb.sea{-webkit-text-stroke:0!important;text-shadow:none!important}
/* man-made places in a Frutiger-style humanist sans (Frutiger itself only if installed); natural features in Georgia */
.lb.city,.lb.village,.lb.hamlet{font-family:Frutiger,'Frutiger LT Std','Frutiger Next','Segoe UI','Myriad Pro','Helvetica Neue',Arial,sans-serif!important}
.lb.sea,.lb.water,.lb.ridge,.lb.region,.lb.realm{font-family:Georgia,'Times New Roman',serif!important}
.slot.target{outline:3px solid var(--blue);outline-offset:-3px;z-index:1}
.slot.target.ghost{background:rgba(91,155,234,.08)}
.slot .tc{position:absolute;box-sizing:border-box;border:2px solid var(--blue);background:rgba(91,155,234,.38);pointer-events:none;z-index:3}
.hist{margin:0;padding:0;list-style:none;font-family:var(--mono);font-size:11px;color:var(--ink2);max-height:130px;overflow:auto;border-top:1px solid var(--line)}
.hist li{padding:4px 0;border-bottom:1px solid var(--line)}.hist li b{color:var(--ink);font-weight:500}
.hist li.cur{color:var(--ink)}
.expimg{width:100%;max-height:62vh;object-fit:contain;background:#000;border:1px solid var(--line)}
.slot{position:relative;width:var(--cw);aspect-ratio:4/5;border:0;padding:0;background:transparent;display:block;cursor:pointer}
.slot img{width:100%;height:100%;display:block;object-fit:cover}
.nophoto .slot img{visibility:hidden}
.slot.ghost{outline:1px dashed var(--line);outline-offset:-1px;cursor:default}
div.slot.ghost:not(.target){outline:none}
.slot.ghost img{display:none}
.empty{font-family:var(--mono);font-size:13px;color:var(--ink2);text-align:center;padding:40px 0}
/* deck + log */
h2{font-family:var(--display);font-size:22px;text-transform:uppercase;margin:22px 0 8px;letter-spacing:.02em}
h2:first-child{margin-top:0}
.counts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.counts div{border:2px solid var(--ink);background:var(--sheet);padding:8px 4px;text-align:center}
.counts b{display:block;font-family:var(--display);font-size:30px;line-height:1}
.counts small{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--ink);background:var(--sheet);padding:3px 8px 3px 4px;font-family:var(--mono);font-size:11px;border-radius:3px}
.chip b{font-family:var(--display);font-size:16px;min-width:20px;text-align:center;background:var(--ink);color:var(--sheet);padding:0 3px;line-height:1.3}
.chip.red b{background:var(--red)}
.chip.old{opacity:.6;text-decoration:line-through}
.entry{display:grid;grid-template-columns:56px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.entry img{width:56px;aspect-ratio:4/5;object-fit:cover;border:1px solid var(--ink);display:block}
.entry .ph{width:56px;aspect-ratio:4/5;background:var(--blank);border:1px solid var(--line)}
.entry .t{font-family:var(--mono);font-size:11px;color:var(--ink2)}
.entry .c{font-family:var(--display);font-size:20px;text-transform:uppercase;line-height:1.1}
.entry .c.red{color:var(--red)}
.entry p{margin:2px 0 0;font-size:13px}
.warn{border:2px solid var(--red);padding:8px 10px;font-family:var(--mono);font-size:12px;margin-bottom:12px;background:var(--sheet)}
.danger{margin-top:24px;display:flex;gap:10px;flex-wrap:wrap}
/* sheet */
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
#sheet[hidden]{display:none}
.sheetbox{background:var(--sheet);border:2px solid var(--ink);max-width:400px;width:100%;max-height:100%;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.sheetbox img{width:100%;max-width:280px;aspect-ratio:4/5;object-fit:cover;border:1px solid var(--ink);align-self:center}
.sheetbox img.expimg{aspect-ratio:auto;max-width:100%}
.sheetbox .t{font-family:var(--mono);font-size:12px;color:var(--ink2);margin:0}
.sheetbox .t b{color:var(--ink);font-weight:500}
.sheetnav{display:flex;gap:8px;justify-content:space-between}
.sheetnav .btn{min-height:40px;padding:6px 12px}
</style>
</head>
<body>
<div id="app">
  <header>
    <div><h1>Open Map</h1><span class="sub" id="sub"></span></div>
    <div class="stats" id="stats"></div>
  </header>
  <main id="main"></main>
  <nav id="nav" aria-label="Sections">
    <button data-tab="map">Map</button>
    <button data-tab="draw">Deck</button>
    <button data-tab="log">Chronicle</button>
    <button data-tab="options">Options</button>
  </nav>
</div>
<input type="file" id="camIn" accept="image/*" capture="environment" hidden>
<input type="file" id="libIn" accept="image/*" hidden>
<input type="file" id="mapIn" accept=".json,application/json" hidden>
<input type="file" id="openIn" accept="image/*" multiple hidden>
<div id="sheet" hidden></div>

<script>
'use strict';
/* ---------- constants ---------- */
const COLS=8, ROWS=10, N=80, PW=400, PH_=500, CELL=50;
/* Quality: panels are still laid out on a 400x500 grid, but photos are stored and drawn Q times sharper (1, 2 or 3). It is read before anything is
   built, so changing it reloads the page. Older, lower-quality panels just show softer next to new ones. */
const Q=(()=>{try{const v=+localStorage.getItem('strata-q');return v===2||v===3?v:1}catch(e){return 1}})(), QW=PW*Q, QH=PH_*Q;
const POP=[0,400,800,1200,2400];
const TIERC=['#d6d9d0','#6fb23f','#c63a2d','#8d9096','#17181a'];
const PAPER='#16181c', BLANK='#22262c';
const PAL=['#1f5fa8','#6fb23f','#c63a2d','#e7c34a','#16202b','#8d9096','#b58a5b','#f8f8f3','#7fb5d6','#d98aa0'];
const DIMN=['The Red Dimension','Black Ness','The Flood','Re-Birth','The Frozen Dimension','The Verdant Dimension'];
const PROMPTS={
  photo:['Something you have never really looked at.','Find a face in an object.','A shape that looks like a map of somewhere.','Shoot something small as if it were a landscape seen from far away.','A texture that looks like terrain: a coastline, a ridge, a river.','Something that looks bigger than it is.','The gap between two things.','Something you would normally step over.','An object seen from underneath.','What you are standing on, from above.','A pattern nobody planned.','Where one material turns into another.','Something you would usually crop out.','Things lined up by accident.','The inside of something.','Something that looks like it belongs to another place.','Something with one hard edge and one soft one.','Look up. Shoot what is above you.','A surface within arm’s reach, filling the frame.','Something that repeats.','The most ordinary object nearby, very close.','A shadow on a wall or floor.',"Something that casts a shadow.","A reflection of any kind.","Something being held or carried.","A corner where three surfaces meet.","Something you walk past every day.","Something left behind."],
  mono:['Peeling, flaking or blistering.','Grain: wood, stone, fabric or skin.','The roughest surface you can reach.','A surface worn by walking, rubbing or leaning.','Rust, stains or water marks.','Lichen, moss or mould.','Wrinkles, folds or creases.','Something that looks like rock but is not.','Fibres, threads or strands.','Something that shows how it was made.','Bark, scales or shell.','Something old.','Something that holds light.','A texture you could feel from here.','Something half hidden.','Two things touching.','Something worn smooth.',"Something in shade.","Cloth, paper or skin.","Something that has been repaired.","A shadow with a clear shape.","Something cracked.","Something cold to touch."],
  band:['The colour of the shade, not of the thing.','Three colours that happen to sit together.','A colour that changes across one surface.','Something faded by the sun.','The colour of the light, not of the object.','The same colour in two different materials.','A colour you only see when you get close.','Where one colour bleeds into another.','Fill the frame with one colour.','The sky, or the closest thing to it.','Two colours meeting at a line.','Something green.','Something rust, red or orange.','Something pale and quiet.',"A colour you rarely wear.","The horizon, wherever you can find one.","Something blue.","Something yellow.","The darkest thing in the room.","A colour that clashes with the last photo."],
  dots:['Rows of tiny holes.','Something pitted, pocked or perforated.','A cluster of round things.','Dots made by water, dirt or wear.','A tiny pattern you usually miss.','A grid of studs, rivets or bumps.','Light coming through small gaps.','A texture made of many small marks.','Small lights, or small bright things.','Something with holes or spots.','A scatter of small objects.','Leaves, stones or crumbs.','Rain, dust or condensation.','A pattern made by people.',"Something that glows.","Raindrops, dew or bubbles.","Buttons, tiles or bolts.","Something speckled.","Distant lights.","Seeds, grains or sand."],
  city:['A shape that could be a building from far away.','Layers: something in front of something in front of something.','A stack of rectangles.','Something that looks like a tiny city.','A skyline made of small objects.','Streets and blocks: the lines and the spaces between them.','A cluster of different heights.','Rooftops, or things that look like rooftops.','Something built by people.','A cluster of small things.','Windows, lit or dark.','A doorway or a gate.','A row of anything.','Something with a grid.',"A roof, seen from below.","Something with a chimney or a pipe.","A staircase.","A sign or a number.","A bridge, or anything that spans.","A fence line with something behind it."],
  water:['Something wet or reflective.','Ripples, puddles, droplets or steam.','A surface that looks like water but is not.','Condensation on glass.','Something shiny that looks liquid.','A drain, a gutter, anything water follows.','Wet ground or a wet wall.','Light moving across a surface.','A stain that spread like a coastline.','Something blue or grey and cool.'],
  green:['Leaves up close.','A weed growing where it should not.','A pattern of growth.','Grass blades, close enough to count.','Branches against the sky.','A seed pod, bud or flower head.','The shade under a plant.','Moss, lichen or ivy.','Something green and out of place.','Many leaves overlapping.'],
  dry:['Sand, dust or grit.','Cracked earth, paint or mud.','Peeling or flaking.','Pale stone.','Rough paper or card.','Something worn by wind or sun.','Rust or dry rot.','Something brittle.','Straw, husks or dead leaves.','A surface with ripples left by something.'],
  roll:['Camera roll: choose anything.','Camera roll: scroll with your eyes shut, stop, and use that photo.','Camera roll: a screenshot you have taken.','Camera roll: a screenshot you never needed.','Camera roll: a photo of a place you have since left.'],
  wall:['A line that divides light from dark.','Something that makes a ridge.','Stripes made by shadow.','Overlapping edges.','Something layered like strata.','A long line leading away from you.','A line your eye cannot help following.','The straightest thing you can find.','Cracks that branch like rivers.','A surface made of many parallel lines.','Strong straight lines.','A fence, a rail or a barrier.','Something geometric and man-made.','A stack of anything.','Bars, slats or stripes.','The edge of a building against sky.',"A brick or block pattern.","A crack running in a line.","A shutter, blind or grille.","A long shadow edge.","Something that holds back water.","A door that stays shut."]
};
/* Darkroom rule: every photo draw rolls an Edit die and a Level die. The edit is forced onto the photo before it is cut into squares. */
const EDITS=[
  {n:'Zoom',d:s=>`Crop in ${(1.6+s*.4).toFixed(1)}× on a random region.`},
  {n:'Turn',d:s=>s<=2?'Mirror it left to right.':s<=4?'Turn it upside down.':'Turn it a quarter turn.'},
  {n:'Posterise',d:s=>`Reduce to ${[6,5,4,3,2,2][s-1]} tones per colour.`},
  {n:'Hue turn',d:s=>`Rotate every hue by ${s*50}°.`},
  {n:'Two colours',d:()=>'Reduce the photo to two colours.'},
  {n:'Slip',d:()=>'Slice it into bands and slide them sideways.'},
  {n:'Channel swap',d:s=>['Red and green swap places.','Green and blue swap places.','Red and blue swap places.','The colour channels rotate one way.','The colour channels rotate the other way.','Channels swap, then every tone inverts.'][s-1]},
  {n:'Gradient map',d:()=>'Recolour by brightness with a random three-colour ramp. Higher levels add contrast.'},
  {n:'Halftone',d:s=>`Rebuild it as dots ${Math.round(5+s*1.5)} px apart, sized by darkness.`},
  {n:'Stripes',d:s=>`Invert alternate diagonal bands, ${10+s*8} px wide.`},
  {n:'Tile',d:s=>{const n=[2,2,3,3,4,4][s-1];return `Repeat it as a ${n} by ${n} tile${s>=3?', mirrored on alternate tiles':''}.`}},
  {n:'Solarise',d:()=>'Invert every tone above a threshold that drops with level.'},
  {n:'Ocean',d:s=>`Turn brightness into ocean depth, with wave lines ${Math.round(5+s*1.5)} bands deep.`},
  {n:'Lake',d:s=>`Everything darker than ${Math.round((.25+s*.08)*100)}% brightness fills with water, ringed by shore. The rest stays land.`},
  {n:'River',d:s=>{const n=(s+1)>>1;return `${n} meandering river${n>1?'s':''}, ${5+s*2} px wide, cut across a greened photo.`}},
  {n:'Grassland',d:()=>'Recolour to grass greens and prick with blades.'},
  {n:'Plains',d:()=>'Patchwork the photo into fields of green and ochre.'},
  {n:'Dunes',d:s=>'Recolour to sand with wind ripples.'},
  {n:'Forest',d:s=>'Recolour to dark greens and crowd it with canopy.'},
  {n:'Marsh',d:()=>'Mottle into pooled water and reedy ground.'}
];
const RAMPS=[['#16202b','#c63a2d','#e7c34a'],['#0b1f4d','#1f8a8a','#f6f5ef'],['#2b0f3a','#d9468f','#ffd9a0'],['#0f2a1a','#6fb23f','#f2f0c2'],['#3a0d0d','#e86a1c','#fff2b0'],['#101820','#5b9bea','#f7e9c8']];
const DUO=[['#16202b','#e7c34a'],['#1f5fa8','#f6f5ef'],['#c63a2d','#f6f5ef'],['#16202b','#6fb23f'],['#1f5fa8','#e7c34a']];
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
function applyEdit(cv,e,s,seed){
  const ctx=cv.getContext('2d',{willReadFrequently:true}),r=rng(seed),tmp=document.createElement('canvas');
  tmp.width=QW;tmp.height=QH;tmp.getContext('2d').drawImage(cv,0,0);
  const clamp=v=>v<0?0:v>255?255:v;
  if(e===1){const z=1.6+s*.4,w=PW/z,h=PH_/z;{const sx=r()*(PW-w),sy=r()*(PH_-h);ctx.drawImage(tmp,sx*Q,sy*Q,w*Q,h*Q,0,0,PW,PH_)}}
  else if(e===2){
    ctx.save();
    if(s<=2){ctx.translate(PW,0);ctx.scale(-1,1);ctx.drawImage(tmp,0,0,PW,PH_)}
    else if(s<=4){ctx.translate(PW,PH_);ctx.rotate(Math.PI);ctx.drawImage(tmp,0,0,PW,PH_)}
    else{ctx.translate(PW/2,PH_/2);ctx.rotate(Math.PI/2);ctx.scale(1.25,1.25);ctx.drawImage(tmp,-PW/2,-PH_/2,PW,PH_)}
    ctx.restore();
  } else if(e===3||e===4||e===5){
    const id=ctx.getImageData(0,0,QW,QH),d=id.data;
    if(e===3){const L=[6,5,4,3,2,2][s-1];for(let o=0;o<d.length;o+=4)for(let k=0;k<3;k++)d[o+k]=Math.round(d[o+k]/255*(L-1))/(L-1)*255}
    else if(e===4){
      const a=s*50*Math.PI/180,c=Math.cos(a),n=Math.sin(a);
      for(let o=0;o<d.length;o+=4){const R=d[o],G=d[o+1],B=d[o+2];
        d[o]=clamp(R*(.213+c*.787-n*.213)+G*(.715-c*.715-n*.715)+B*(.072-c*.072+n*.928));
        d[o+1]=clamp(R*(.213-c*.213+n*.143)+G*(.715+c*.285+n*.140)+B*(.072-c*.072-n*.283));
        d[o+2]=clamp(R*(.213-c*.213-n*.787)+G*(.715-c*.715+n*.715)+B*(.072+c*.928+n*.072))}
    } else {
      const pr=DUO[Math.floor(r()*DUO.length)],A=hex(pr[0]),B=hex(pr[1]),thr=.5+(s-3.5)*.05;
      for(let o=0;o<d.length;o+=4){const l=(.2126*d[o]+.7152*d[o+1]+.0722*d[o+2])/255,C=l>thr?B:A;d[o]=C[0];d[o+1]=C[1];d[o+2]=C[2]}
    }
    ctx.putImageData(id,0,0);
  } else if(e===6){
    for(let y=0;y<PH_;){const h=Math.min(PH_-y,16+Math.floor(r()*56)),sh=Math.round((r()*2-1)*s*18);
      ctx.drawImage(tmp,0,y*Q,QW,h*Q,sh,y,PW,h);if(sh)ctx.drawImage(tmp,0,y*Q,QW,h*Q,sh-Math.sign(sh)*PW,y,PW,h);y+=h}
  } else if(e===7||e===8||e===10||e===12){
    const id=ctx.getImageData(0,0,QW,QH),d=id.data;
    if(e===7){
      const P=[[1,0,2],[0,2,1],[2,1,0],[1,2,0],[2,0,1],[1,0,2]][s-1];
      for(let o=0;o<d.length;o+=4){const a=d[o],b=d[o+1],c=d[o+2],v=[a,b,c];d[o]=v[P[0]];d[o+1]=v[P[1]];d[o+2]=v[P[2]];if(s===6){d[o]=255-d[o];d[o+1]=255-d[o+1];d[o+2]=255-d[o+2]}}
    } else if(e===8){
      const R=RAMPS[Math.floor(r()*RAMPS.length)].map(hex),k=.7+s*.2;
      for(let o=0;o<d.length;o+=4){let l=(.2126*d[o]+.7152*d[o+1]+.0722*d[o+2])/255;l=clamp((l-.5)*k*255+127.5)/255;
        const A=l<.5?R[0]:R[1],B=l<.5?R[1]:R[2],t=l<.5?l*2:(l-.5)*2;for(let q=0;q<3;q++)d[o+q]=A[q]+(B[q]-A[q])*t}
    } else if(e===10){
      const w=(10+s*8)*Q;for(let y=0;y<QH;y++)for(let x=0;x<QW;x++)if(Math.floor((x+y)/w)%2){const o=(y*QW+x)*4;d[o]=255-d[o];d[o+1]=255-d[o+1];d[o+2]=255-d[o+2]}
    } else {
      const thr=255*(.9-s*.1);for(let o=0;o<d.length;o+=4)for(let q=0;q<3;q++)if(d[o+q]>thr)d[o+q]=255-d[o+q];
    }
    ctx.putImageData(id,0,0);
  } else if(e===9){
    const g=5+s*1.5,src=tmp.getContext('2d').getImageData(0,0,QW,QH).data;
    ctx.fillStyle='#f1ede2';ctx.fillRect(0,0,PW,PH_);
    for(let y=g/2;y<PH_;y+=g)for(let x=g/2;x<PW;x+=g){const o=(Math.floor(y*Q)*QW+Math.floor(x*Q))*4,l=(.2126*src[o]+.7152*src[o+1]+.0722*src[o+2])/255;
      ctx.fillStyle=`rgb(${src[o]},${src[o+1]},${src[o+2]})`;ctx.beginPath();ctx.arc(x,y,Math.max(.6,g*.62*(1-l*.7)),0,7);ctx.fill()}
  } else if(e===11){
    const n=[2,2,3,3,4,4][s-1],tw=PW/n,th=PH_/n;
    for(let ty=0;ty<n;ty++)for(let tx=0;tx<n;tx++){ctx.save();ctx.translate(tx*tw+(((tx+ty)&1)&&s>=3?tw:0),ty*th);ctx.scale(((tx+ty)&1)&&s>=3?-1:1,1);ctx.drawImage(tmp,0,0,QW,QH,0,0,tw,th);ctx.restore()}
  } else if(e>=13){
    /* Terrain edits: brightness becomes elevation or moisture, then land-cover texture is drawn on top. */
    const id=ctx.getImageData(0,0,QW,QH),d=id.data,L=o=>(.2126*d[o]+.7152*d[o+1]+.0722*d[o+2])/255;
    const ramp=st=>{const A=st.map(hex);return l=>{l=Math.max(0,Math.min(.9999,l));const f=l*(A.length-1),i=Math.floor(f),t=f-i;return A[i].map((v,q)=>v+(A[i+1][q]-v)*t)}};
    const put=(o,c)=>{d[o]=c[0];d[o+1]=c[1];d[o+2]=c[2]};
    if(e===13){
      const R=ramp(['#06213f','#0f4c81','#2d8ac0','#a9dbea']),w=5+s*1.5;
      for(let o=0;o<d.length;o+=4){const l=L(o),c=R(l);if((l*w)%1<.1){c[0]+=40;c[1]+=40;c[2]+=40}put(o,c)}
      ctx.putImageData(id,0,0);
    } else if(e===14){
      const thr=.25+s*.08,W=ramp(['#0b3d6b','#4da3d4']),SH=hex('#e8dcb0');
      for(let o=0;o<d.length;o+=4){const l=L(o);if(l<thr)put(o,W(l/thr));else if(l<thr+.05)put(o,SH);else{d[o]=d[o]*.75+28;d[o+1]=d[o+1]*.75+38;d[o+2]=d[o+2]*.75+18}}
      ctx.putImageData(id,0,0);
    } else if(e===15){
      for(let o=0;o<d.length;o+=4){d[o]=d[o]*.72+25;d[o+1]=d[o+1]*.72+40;d[o+2]=d[o+2]*.72+20}
      ctx.putImageData(id,0,0);
      const n=(s+1)>>1,w=5+s*2;ctx.lineCap='round';ctx.lineJoin='round';
      for(let k=0;k<n;k++){
        const x0=PW*(.15+.7*r()),amp=40+r()*70,ph=r()*6.3,len=60+r()*50,pts=[];
        for(let y=-10;y<=PH_+10;y+=8)pts.push([x0+amp*Math.sin(y/len+ph)+(k-(n-1)/2)*40,y]);
        for(const [lw,col] of [[w+7,'#e3d9a6'],[w,'#2f86c6'],[w*.3,'#9bd5f2']]){ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke()}
      }
    } else if(e===16){
      const R=ramp(['#274a1b','#5a9632','#cfe070']);
      for(let o=0;o<d.length;o+=4)put(o,R(L(o)));
      ctx.putImageData(id,0,0);ctx.lineWidth=1.2;
      for(let k=0;k<2600;k++){const x=r()*PW,y=r()*PH_,o=((y*Q|0)*QW+(x*Q|0))*4;ctx.strokeStyle=`rgba(${Math.min(255,d[o]+30)},${Math.min(255,d[o+1]+35)},${d[o+2]},.7)`;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+(r()-.5)*2,y-4-r()*5);ctx.stroke()}
    } else if(e===17){
      for(let o=0;o<d.length;o+=4){const g=60+L(o)*195;d[o]=d[o+1]=d[o+2]=g}
      ctx.putImageData(id,0,0);

  spill:['Spill','On 4 to 6 the edit crosses a panel edge into a neighbour that exists. A 6 goes two squares deep.'],
  seam:['Seam','Picks which edge a spill crosses when more than one qualifies.'],
  reach:['Reach','How far a road, railway or flight goes. 1 is the nearest settlement, 6 the furthest.'],
  overflow:['Overflow','An Overflow Window always tries to spill over a panel edge.'],

function pickSpill(key,cells,sp,seam){
  if(sp<4||!cells.length)return null;
  const [x,y]=key.split(',').map(Number),depth=sp===6?2:1,opts=[];
  for(const e of ['N','E','S','W']){

    const out=[];

      const cx=i%COLS,cy=(i/COLS)|0,dist=e==='N'?cy:e==='S'?ROWS-1-cy:e==='W'?cx:COLS-1-cx;
      if(dist>3)continue;

        if(!np.w[j]&&!out.includes(j))out.push(j);

async function runOpening(files){
  if(OPEN||Object.keys(S.panels).length)return;
  files=files.filter(f=>f&&(!f.type||f.type.startsWith('image/'))).slice(0,12);
  if(files.length<5){alert_('Choose at least 5 photos. 12 is best.');return}
  tab='map';

  const photos=shuffle(files),jobs=photos.map((f,i)=>({f,key:i<5?OPEN_KEYS[i]:OPEN_KEYS[rand(5)]}));

  <p>A solo ritual. Each day, draw a card, roll the dice, take a photo and place it. The map grows by many small changes and never has to be finished.</p>
  <h2>Opening</h2>
  <ul><li>Choose 12 photos (at least 5). Each goes through the darkroom and onto one of five panels in a plus shape.</li><li>Every panel gets at least one photo. Dice choose squares, edit and spill.</li></ul>

  <ul><li><b>Draw</b> a card. The number is how many squares it works. Black runs clockwise, red runs counter-clockwise.</li>
  <li><b>Roll.</b> Panel (two dice) picks the panel. Start sets the sweep direction in 60° steps. Prompt tells you what to photograph.</li>
  <li><b>Photograph</b> or choose a photo. The Edit and Level dice force a darkroom change onto it.</li>
  <li><b>Place it.</b> The photo is fitted to the squares you cover and treated by the card's mode.</li></ul>
  <h2>Choosing squares</h2>
  <ul><li>Blank squares first, then void squares, then painted ones. Walled squares are skipped.</li>
  <li><b>Grow</b> (paint cards on a panel that has paint): 1 to 4 starts new squares beside existing paint. 5 or 6 sweeps from the Start direction.</li>
  <li><b>Spill</b> (4 to 6) lets the edit cross a panel edge into a neighbour that exists. A 6 goes two squares deep. <b>Seam</b> picks the edge.</li></ul>
  <h2>The darkroom</h2>
  <p>Edit die (${EDITS.length} sides): ${edits}. Level (1 to 6) sets the strength. Plain Window skips it. Echo repeats your last edit.</p>
  <h2>Photo cards</h2>
  <ul><li><b>Window, Big Window, Overflow Window, Echo, Plain Window:</b> your photo shows through. Overflow always tries to spill.</li>
  <li><b>Water, Green, Dry, Colour, Pattern, Warp Window:</b> the darkroom draws from one family of edits only (water, greenery, dry land, colour, pattern, warp).</li>
  <li><b>Ink, Sepia, Pixel Window:</b> the photo is cut to black ink, toned old brown, or melted into 5 by 5 blocks.</li>
  <li><b>Paint Band, Polka, Checkerboard, Scatter, Mono Window:</b> flat colour per square, dots, alternate squares, random squares or greyscale.</li>
  <li><b>Settlement, Great Settlement:</b> your photo stays under a pattern, by size: dots, dashes or rings, street grids, crosshatch. Darker photo areas grow bigger settlements.</li>
  <li><b>New Panel:</b> opens a panel next to the map, nearest the centre.</li>
  <li><b>Wall:</b> protects painted squares from voids, erosion and new paint. Walls become ridgelines on the map.</li></ul>
  <h2>Cards without a photo</h2>
  <ul><li><b>Void:</b> spreads across painted squares and the people there are lost. Walls hold.</li>
  <li><b>Erosion:</b> painted squares weather back to blank, and the people there are lost.</li>
  <li><b>Next Dimension:</b> a panel moves through Red Dimension, Black Ness, Flood, Re-Birth, Frozen and Verdant. Black Ness darkens it. Flood grows rivers that run downhill. Each dimension bends the panel's climate (scorched, freezing, swampy, lush), and the change fades across the edges into its neighbours. Tap a square to read it.</li>
  <li><b>Mirror:</b> flips a panel left to right.</li>
  <li><b>Road, Railway:</b> join two settlements. The Reach die picks how far. The route bends around steep ground, curves through its turns and can cross panels.</li>
  <li><b>Flight:</b> a dotted flight path with a small plane, arcing between two settlements. It ignores terrain and always reaches towards the far half of the map's settlements, so it links distant cities. Dotted lines on the map always mean flights.</li>
  <li><b>Rewind:</b> one panel goes back a generation, once.</li>
  <li><b>Wildfire, Flood, Earthquake, Eruption, Meteor Strike, Plague, Landslide, Drought, Tsunami, Great Calamity:</b> a disaster strikes painted squares on a panel. The terrain steers it: fire burns green ground, floods follow the rivers and swell them, eruptions pour downhill, tsunamis only reach the coast. The Level die sets the damage: 1 to 2 settlements drop a tier, 3 to 4 two tiers, 5 to 6 razed. Walls take one level less. The scar is drawn over the map and fades as the map is updated, but the people lost stay lost. Painting over a scar clears it.</li>
  <li><b>Events:</b> Outbreak, Famine, Migration, Festival and Border Dispute land on settlements and leave something behind for a few changes: lost or gained people, output up or down, closed routes. Places they trade with feel them too.</li>
  <li><b>Realms:</b> each great city holds the land nearest to it. Rivers, walls and snowy mountains slow its reach, so borders follow them. The Realms button switches to a realm view: every other layer and name goes off, leaving the plain map with the realms tinted and named. Press it again and everything comes back as it was. Names turns the other labels back on while you are in it.</li>
  <li><b>Ruins:</b> a void, erosion, disaster or dimension that wipes out a settlement leaves ruins on the map. If someone builds there again, the square remembers.</li>
  <li><b>Rivers:</b> settlements beside the same river trade by boat, until it freezes, runs dry or floods.</li>
  <li><b>Supply:</b> cities need food, fuel (from the Forge Age) and the raw goods their industries use; some villages need food. A place makes do with its own land, or is supplied by a road, river or flight path from a neighbour that makes the good (a railway reaches two stops along). If the route is closed, or the supplier is down or short itself, the place goes short: its output falls and its population shrinks a little more with each change until supply returns. Short places have a red ring on the map.</li>
  <li><b>Continents:</b> the stats count separate landmasses and the share held by the biggest. As the painted map grows past about 8 panels' worth, the sea level rises with it, flooding the lowest ground first, so big landforms tend to break at their low points. The Rift and Sundering cards cut a channel from one coast to a far one and the sea fills it; places on the rift are lost.</li>
  <li><b>Wars and unrest:</b> neighbouring realms build tension along their shared border, faster when one is short of supplies or much bigger than the other, and slower when routes link them. Past a threshold a war can break out on its own. Routes between the realms close, both sides lose people each change, and now and then the stronger side takes a border place. A war ends in peace, with the taken places kept, or in conquest if a realm is down to its capital. A large realm with a rival city, shortages or a losing war can also split in a civil war, and the rival city becomes a new realm. The Realms view draws fronts between fighting realms in red.</li>
  <li><b>More cards:</b> Boom, Bust, Trade Fair, Discovery, Invention and Exhibition change a settlement's population for a while. Granary shields places from food shortage. Refugees move people from the hungriest place. Wonder adds people for good and names the city. Treaty, Declaration, Alliance, Uprising and Coup act on realms. Canal, Dam and Inland Sea cut water into the biggest landmass (Canal and Inland Sea start in the reserve, as does Sundering, because they split land so hard; add them from the Deck tab if you want them), and Ice Age turns the world cold and drops the sea.</li>
  <li><b>Weather Front:</b> storms, blizzards, heat haze, dust storms, fog and auroras. The Weather die picks one, tilted by the panel's biome and the season, and the Level die sets its strength. It harms no one and passes within a few changes. Storms and blizzards close roads and railways, dust closes roads, and flights are grounded by storms, blizzards, dust and fog. Closed routes show dashed red on the trade lines and in the settlement card. Heat haze makes a wildfire there one level worse, and a storm does the same for a flood. It also changes the flora on the Flora layer, and a settlement's card and inspect readout show whether its output is up or down while the weather lasts.</li>
  <li><b>Rising Tide, Falling Tide:</b> the Level die moves the sea one to three steps.</li>
  <li><b>Cold Snap, Heatwave, Monsoon, Dry Spell:</b> the Level die shifts the climate of the whole map. Turn on Climate in the map controls to see the biomes move.</li></ul>
  <h2>The deck changes itself</h2>
  <ul><li><b>Add Card</b> brings one in from the reserve unseen. <b>Retire Card</b> removes one for good (its rule stays on the Deck tab). <b>Adjust Numbers</b> changes three numbers by 1 to 3. <b>Shuffle</b> returns the discard to the pile.</li>
  <li>When the pile runs out, the discards are reshuffled. A card with nothing to act on is simply discarded.</li></ul>
  <h2>Reading the map</h2>
  <ul><li><b>Sea:</b> blank ground reached from the outside edge of the map, out to the tide's reach. Paint a square to take it back. Roads avoid the sea when they can, and big coastal cities are named ports.</li><li><b>Contours</b> (off by default): dense lines over filled squares. Brighter ground is higher, voids are pits, walls and settlements raise land.</li>
  <li><b>Labels:</b> settlements get names. Voids, walls, floods and Black Ness get strange legends.</li>
  <li>Pinch to zoom. The slider and Time-lapse replay the history. Tap a panel for its generations. Export saves the whole map as one image.</li></ul>
  </div>`;
}

/* hand a file to the person: the app's own download first, then the share sheet, then a plain download link. Answers 'saved', 'shared' or 'cancelled'. */
async function giveFile(blob,name){

  const f=new File([blob],name,{type:blob.type||'application/octet-stream'});
  try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return 'shared'}}catch(e){if(e&&e.name==='AbortError')return 'cancelled'}

/* A single panel for saving or viewing: its stored photo, plus (when asked) the same layers the map shows, cropped to that panel. */

  const {minx,maxx,miny,maxy}=bbox(),Wp=maxx-minx+1,Hp=maxy-miny+1,fx=(p.x-minx)/Wp,fy=(maxy-p.y)/Hp,cv=document.createElement('canvas');cv.width=w;cv.height=h;
  const g=cv.getContext('2d');if(showPhotos)g.drawImage(im,0,0,w,h);else{g.fillStyle='#0e1013';g.fillRect(0,0,w,h)}URL.revokeObjectURL(im.src);
  const crop=r=>g.drawImage(r.canvas,fx*r.canvas.width,fy*r.canvas.height,r.canvas.width/Wp,r.canvas.height/Hp,0,0,w,h);
  for(const [,build,on] of LAYERS)if(on())crop(await build(S.seq));

  if(showContours){const r=await buildContours(S.seq);crop(r);g.font=`400 ${10*F}px system-ui,Helvetica,Arial,sans-serif`;
    for(const l of r.labs){const px=(l.x/r.lw*Wp-(p.x-minx))*w,py=(l.y/r.lh*Hp-(maxy-p.y))*h;if(px<0||py<0||px>w||py>h)continue;g.save();g.translate(px,py);g.rotate(l.a);g.fillStyle='rgba(244,164,132,.85)';g.fillText(l.t,0,0);g.restore()}}
  if(labelsOn()){const cs=w/COLS,c0=(p.x-minx)*COLS,r0=(maxy-p.y)*ROWS;
    const Ls=labelList();
    for(const l of LASTDOTS){if(Ls.includes(l))continue;const px=(l.c-c0)*cs,py=(l.r-r0)*cs;if(px<0||py<0||px>w||py>h)continue;drawDot(g,l.kind,px,py,F)}
    for(const l of Ls){const px=(l.c-c0)*cs,py=(l.r-r0)*cs;if(px<0||py<0||px>w||py>h)continue;
      g.save();g.translate(px,py);drawLabel(g,l,F);g.restore()}}

}
async function exportMapFile(btn){

  if(st)S=st;else if(local&&(cloud.mode!=='cloud'||curMap==='main'))S=local;

  for(const l of S.log)if(asset(l.img))IMG[l.img]='/_blob/'+l.img;

  {const D=S.deck;
    [['Echo','black',8,'paint','photo'],['Plain Window','red',6,'paint','photo'],['Road','black',1,'link','road'],['Railway','red',1,'link','rail'],['Flight','black',1,'link','air'],['Rewind','black',1,'rewind']].forEach(([name,color,units,kind,mode],k)=>{

  {const D=S.deck,sw=id=>D.cards[id]&&D.cards[id].kind==='swap';D.draw=D.draw.filter(i=>!sw(i));D.discard=D.discard.filter(i=>!sw(i));D.reserve=D.reserve.filter(i=>!sw(i));D.waiting=(D.waiting||[]).filter(i=>!sw(i));if(S.cur&&sw(S.cur.cardId))S.cur=null}
  {const D=S.deck,tl=id=>D.cards[id]&&D.cards[id].kind==='timelapse';D.draw=D.draw.filter(i=>!tl(i));D.discard=D.discard.filter(i=>!tl(i));D.reserve=D.reserve.filter(i=>!tl(i));if(S.cur&&tl(S.cur.cardId))S.cur=null}
